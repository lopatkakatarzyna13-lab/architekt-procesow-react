name: SEC-04 branch validation
on:
  push:
    branches:
      - feature/architekt-2-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: SEC-04 HTTP and persistent quota smoke tests (no npm or API key)
        run: node --test server/security.smoke.mjs server/persistentUsage.smoke.mjs experiments/supabase-auth/ai-handler.smoke.mjs
      - name: Exercise AI Edge entry point with network mocks
        run: node --experimental-strip-types --test experiments/supabase-auth/ai-entry.smoke.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npx vitest run
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
