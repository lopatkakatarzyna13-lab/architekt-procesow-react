name: Isolated Supabase Auth test
on:
  push:
    branches:
      - feature/architekt-2-mvp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres_image: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compare-postgres]')) && '["default", "17.12.0.005"]' || '["17.12.0.005"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Check fixture locality and hosted-runtime denial
        run: node --experimental-strip-types --test experiments/supabase-auth/edge-locality.smoke.mjs
      - name: Install browser for the isolated integration test
        run: |
          npm install --prefix /tmp/architekt-browser --no-save playwright@1.56.1
          ln -s /tmp/architekt-browser/node_modules/playwright node_modules/playwright
          ln -s /tmp/architekt-browser/node_modules/playwright-core node_modules/playwright-core
          node /tmp/architekt-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Install official Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.98.0
      - name: Start isolated local Supabase and test Auth
        shell: bash
        env:
          POSTGRES_TEST_IMAGE: ${{ matrix.postgres_image }}
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/architekt-supabase"
          mkdir -p "$test_dir"
          cd "$test_dir"
          supabase init
          mkdir -p supabase/functions
          cp -R "$GITHUB_WORKSPACE/experiments/supabase-auth/workshop-fixture" supabase/functions/
          python3 - "$POSTGRES_TEST_IMAGE" <<'PY'
          import sys
          from pathlib import Path

          p = Path('supabase/config.toml')
          s = p.read_text()
          if 'jwt_expiry = 3600' not in s:
              raise SystemExit('Unexpected local Auth config; refusing to start')
          p.write_text(s.replace('jwt_expiry = 3600', 'jwt_expiry = 60', 1))
          if sys.argv[1] != 'default':
              pin = Path('supabase/.temp/postgres-version')
              pin.parent.mkdir(exist_ok=True)
              pin.write_text(sys.argv[1], encoding='ascii')
          PY
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          test_start=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              db_id=$(docker ps -aq --filter 'name=supabase_db_architekt-supabase' | head -n 1)
              if [ -n "$db_id" ]; then
                docker inspect --format 'DB_STATE status={{.State.Status}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} exit={{.State.ExitCode}}' "$db_id" || true
                docker logs --timestamps --since "$test_start" "$db_id" 2>&1 |
                  python3 "$GITHUB_WORKSPACE/experiments/supabase-auth/db-failure-summary.py" ||
                  echo 'DB_LOG_READ_FAILED'
                docker exec "$db_id" sh -c 'df -Pk "${PGDATA:-/var/lib/postgresql/data}" /dev/shm' |
                  awk 'NR == 2 {print "DB_DATA_FREE_KIB", $4} NR == 3 {print "DB_SHM_FREE_KIB", $4}' || true
                docker exec "$db_id" cat /sys/fs/cgroup/memory.events 2>/dev/null |
                  awk '($1 == "oom" || $1 == "oom_kill") && $2 ~ /^[0-9]+$/ {print "DB_CGROUP", $1, $2}' || true
              fi
            fi
            supabase stop --no-backup >/dev/null 2>&1 || true
            return "$result"
          }
          trap cleanup EXIT
          db_container="supabase_db_architekt-supabase"
          db_image=$(docker inspect --format '{{.Config.Image}}' "$db_container")
          db_version=$(docker exec "$db_container" postgres --version)
          db_image_id=$(docker inspect --format '{{.Image}}' "$db_container")
          printf 'DB_IMAGE %s\nDB_IMAGE_ID %s\nDB_VERSION %s\n' "$db_image" "$db_image_id" "$db_version"
          python3 - "$POSTGRES_TEST_IMAGE" "$db_image" "$db_version" <<'PY'
          import re
          import sys

          target, image, version = sys.argv[1:]
          if target != 'default' and (
              not image.endswith(f'/postgres:{target}') or
              not re.fullmatch(r'postgres \(PostgreSQL\) 17\.12(?:\s.*)?', version)
          ):
              raise SystemExit('The comparison database did not report the requested image and PostgreSQL 17.12.')
          PY
          supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          set -a
          source "$RUNNER_TEMP/supabase-local.env"
          set +a
          cd "$GITHUB_WORKSPACE"
          export EDGE_TEST_DIR="$test_dir"
          node experiments/supabase-auth/db-load-diagnostics.mjs baseline
          node experiments/supabase-auth/local-stack.smoke.mjs
          node experiments/supabase-auth/quota-postgres.smoke.mjs
          node experiments/supabase-auth/ai-quota-postgres.smoke.mjs
          node experiments/supabase-auth/ai-concurrency-postgres.smoke.mjs
          node experiments/supabase-auth/process-crash.smoke.mjs
          node experiments/supabase-auth/browser-integration.mjs
          node experiments/supabase-auth/edge-runtime.smoke.mjs
          node experiments/supabase-auth/ai-edge-runtime.smoke.mjs
          node experiments/supabase-auth/db-load-diagnostics.mjs after-integration
