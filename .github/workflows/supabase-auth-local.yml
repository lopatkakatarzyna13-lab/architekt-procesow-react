name: Isolated Supabase Auth test
on:
  push:
    branches:
      - feature/architekt-2-mvp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Install browser for the isolated integration test
        run: |
          npm install --prefix /tmp/architekt-browser --no-save playwright@1.56.1
          ln -s /tmp/architekt-browser/node_modules/playwright node_modules/playwright
          ln -s /tmp/architekt-browser/node_modules/playwright-core node_modules/playwright-core
          node /tmp/architekt-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Install official Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.98.0
      - name: Start isolated local Supabase and test Auth
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/architekt-supabase"
          mkdir -p "$test_dir"
          cd "$test_dir"
          supabase init
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/config.toml')
          s = p.read_text()
          if 'jwt_expiry = 3600' not in s:
              raise SystemExit('Unexpected local Auth config; refusing to start')
          p.write_text(s.replace('jwt_expiry = 3600', 'jwt_expiry = 60', 1))
          PY
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT
          supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          set -a
          source "$RUNNER_TEMP/supabase-local.env"
          set +a
          cd "$GITHUB_WORKSPACE"
          node experiments/supabase-auth/local-stack.smoke.mjs
          node experiments/supabase-auth/quota-postgres.smoke.mjs
          node experiments/supabase-auth/browser-integration.mjs
