name: Isolated analysis process crash
on:
  push:
    branches:
      - feature/architekt-2-mvp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fictional-local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: postgresql://postgres:fictional-local-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create local fixture roles
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - name: Kill analysis worker and check admission state
        run: node experiments/supabase-auth/process-crash.smoke.mjs
      - name: Check disabling new admission without deleting records
        run: node experiments/supabase-auth/disable-admission-postgres.smoke.mjs
