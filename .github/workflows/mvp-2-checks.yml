name: MVP 2.0 checks

on:
  push:
    branches:
      - feature/architekt-2-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npx vitest run
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Classify dependency advisories (read-only)
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-prod.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          for (const [label, path] of [['all', process.env.RUNNER_TEMP + '/audit-all.json'], ['production', process.env.RUNNER_TEMP + '/audit-prod.json']]) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'))
            console.log('AUDIT_SCOPE', label, JSON.stringify(data.metadata?.vulnerabilities ?? {}))
            for (const [name, v] of Object.entries(data.vulnerabilities ?? {})) {
              console.log('AUDIT_PACKAGE', JSON.stringify({
                scope: label,
                name,
                severity: v.severity,
                direct: v.isDirect,
                range: v.range,
                fix: v.fixAvailable,
                via: v.via.filter(x => typeof x === 'object').map(x => ({
                  name: x.name, title: x.title, url: x.url, severity: x.severity, range: x.range,
                })),
              }))
            }
            if (data.error) console.log('AUDIT_ERROR', label, JSON.stringify(data.error))
          }
          NODE

  browser-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install isolated browser test tooling
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
          npm install --prefix /tmp/architekt-browser --no-save playwright@1.56.1
          ln -s /tmp/architekt-browser/node_modules/playwright node_modules/playwright
          ln -s /tmp/architekt-browser/node_modules/playwright-core node_modules/playwright-core
          node /tmp/architekt-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run workshop browser test with connection interruption
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/architekt-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/architekt-vite.log; exit 1; fi
          node tests/browser-offline.mjs
          node tests/browser-delete-process.mjs
          FICTIONAL_PDF_PATH="$RUNNER_TEMP/fictional-report.pdf" BPMN_SCREENSHOT_PATH="$RUNNER_TEMP/bpmn-preview.png" node tests/browser-fictional-workshop.mjs
          REFERRAL_PDF_PATH="$RUNNER_TEMP/referral-workshop-report.pdf" node tests/browser-referral-workshop.mjs
          REFERRAL_WITH_POOLS=1 REFERRAL_PDF_PATH="$RUNNER_TEMP/referral-workshop-pools-report.pdf" node tests/browser-referral-workshop.mjs
          ACCOUNTING_PDF_PATH="$RUNNER_TEMP/accounting-handoff-report.pdf" node tests/browser-accounting-handoff.mjs
          CORRECTION_PDF_PATH="$RUNNER_TEMP/employee-correction-report.pdf" node tests/browser-employee-correction.mjs
      - name: Resume a saved local workshop after a restart
        env:
          VITE_SUPABASE_URL: https://supabase.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: fictional-ci-key
          VITE_WORKSHOP_AI_MODE: supabase
          VITE_WORKSHOP_AI_ENABLED: 'true'
        run: |
          npm run workshop:prepare
          node tests/browser-local-workshop.mjs
      - name: Prepare, review and resume local AS-IS proposals
        run: node tests/browser-local-workshop-proposal.mjs
      - name: Combine selected AS-IS steps and improvements in local TO-BE
        run: node tests/browser-tobe-improvements.mjs
      - name: Save fictional report for visual review
        uses: actions/upload-artifact@v4
        with:
          name: fictional-workshop-report
          path: |
            ${{ runner.temp }}/fictional-report.pdf
            ${{ runner.temp }}/bpmn-preview.png
            ${{ runner.temp }}/referral-workshop-report.pdf
            ${{ runner.temp }}/referral-workshop-pools-report.pdf
            ${{ runner.temp }}/accounting-handoff-report.pdf
            ${{ runner.temp }}/employee-correction-report.pdf
          retention-days: 1


