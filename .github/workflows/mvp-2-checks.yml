name: MVP 2.0 checks

on:
  push:
    branches:
      - feature/architekt-2-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npx vitest run
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
