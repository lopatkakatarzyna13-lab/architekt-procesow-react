name: MVP 2.0 checks

on:
  push:
    branches:
      - feature/architekt-2-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npx vitest run
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Classify dependency advisories (read-only)
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-prod.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          for (const [label, path] of [['all', process.env.RUNNER_TEMP + '/audit-all.json'], ['production', process.env.RUNNER_TEMP + '/audit-prod.json']]) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'))
            console.log('AUDIT_SCOPE', label, JSON.stringify(data.metadata?.vulnerabilities ?? {}))
            for (const [name, v] of Object.entries(data.vulnerabilities ?? {})) {
              console.log('AUDIT_PACKAGE', JSON.stringify({
                scope: label,
                name,
                severity: v.severity,
                direct: v.isDirect,
                range: v.range,
                fix: v.fixAvailable,
                via: v.via.filter(x => typeof x === 'object').map(x => ({
                  name: x.name, title: x.title, url: x.url, severity: x.severity, range: x.range,
                })),
              }))
            }
            if (data.error) console.log('AUDIT_ERROR', label, JSON.stringify(data.error))
          }
          NODE

  browser-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/architekt-browser --no-save playwright@1.56.1
          ln -s /tmp/architekt-browser/node_modules/playwright node_modules/playwright
          ln -s /tmp/architekt-browser/node_modules/playwright-core node_modules/playwright-core
          node /tmp/architekt-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run workshop browser test with connection interruption
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/architekt-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/architekt-vite.log; exit 1; fi
          node tests/browser-offline.mjs


  update-eslint-once:
    if: >-
      github.event_name == 'push' && contains(github.event.head_commit.message, '[eslint9]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update only ESLint and matching rules package
        run: |
          npm install --global npm@11
          npm install --save-dev --save-exact eslint@9.39.5 @eslint/js@9.39.5 --ignore-scripts
          changed="$(git diff --name-only)"
          echo "$changed"
          mapfile -t files < <(git diff --name-only)
          if [ "${#files[@]}" -ne 2 ] || [ "${files[0]}" != "package-lock.json" ] || [ "${files[1]}" != "package.json" ]; then
            echo "Expected package.json and package-lock.json only."
            exit 1
          fi
      - name: Verify clean install
        run: npm ci
      - name: Verify quality
        run: |
          npx vitest run
          npm run lint
          npm run build
      - name: Require zero known npm advisories
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
      - name: Commit verified version change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: align ESLint 9 and js config to resolve remaining advisories"
          git push origin HEAD:feature/architekt-2-mvp
